[project]
name = "windetect"
version = "0.1.0"
description = "A Windows intrusion captured on real telemetry, and the Splunk detections that proved themselves against it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob Hess" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-defusedxml>=0.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
windetect = "windetect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windetect"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "PTH", "RUF",
    "S",     # bandit-style security checks
    "TRY",   # raise/exception style
    "C4",    # comprehension hygiene
    "A",     # builtin shadowing
    "PT",    # pytest style
    "RET",   # return-statement hygiene
    "ICN",   # import conventions
    "ERA",   # commented-out code
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["src/windetect"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not replay"'
markers = [
    "replay: requires a live Splunk (CI validate job)",
]
