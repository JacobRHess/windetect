# Fixtures arrive over HEC as JSON whose fields are the production Windows
# field names (EventCode, Image, CommandLine, TargetUserName, ...). KV_MODE=json
# is what makes those fields searchable; without it every detection returns
# empty and the replay fails silently in both directions. SHOULD_LINEMERGE off:
# one JSON event per line. The harness sets _time from each event's own
# timestamp so windowed searches measure the captured timeline, not ingest time.

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
KV_MODE = json
SHOULD_LINEMERGE = false

[WinEventLog:Security]
KV_MODE = json
SHOULD_LINEMERGE = false

[WinEventLog:Microsoft-Windows-PowerShell/Operational]
KV_MODE = json
SHOULD_LINEMERGE = false
