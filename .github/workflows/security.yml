name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so advisories that land after a merge still get caught

permissions:
  contents: read

jobs:
  # Audit the GitHub Actions workflows themselves for injection, credential persistence,
  # unpinned actions, and over-broad permissions.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --extra dev --frozen
      - name: Audit workflows (zizmor)
        # The token enables zizmor's online checks (impostor commits, known-vulnerable
        # actions), not just the offline audit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run zizmor .github/workflows

  # Scan the whole history for committed secrets. Lab-only dev credentials are allowlisted
  # in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
